    <title>EsToDoList</title>
    <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-slate-100 text-slate-800 min-h-screen">

    <header class="bg-green-600 text-white">
        <div class="px-4 py-3 flex items-center justify-between">
            <h1 class="text-2xl font-bold">EsToDoList</h1>
            <span class="text-xs sm:text-sm">Organize sua rotina escolar</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 py-4 flex flex-col gap-4 xl:grid xl:grid-cols-3">

        <!-- FORMS -->

            <form class="flex flex-col gap-2 md:flex-row xl:flex-col">

                <input type="text" placeholder="Nova tarefa"
                    class="w-full min-w-0 md:flex-1 xl:w-full border border-indigo-500 rounded-lg px-3 py-3 outline-none focus:ring-2 focus:ring-indigo-500">

                <input type="date"
                    class="w-full min-w-0 md:w-36 md:shrink-0 xl:w-full border border-indigo-500 rounded-lg px-3 py-3 outline-none focus:ring-2 focus:ring-indigo-500">

                <button type="submit"
                    class="w-full md:w-auto md:shrink-0 xl:w-full bg-green-500 text-white rounded-lg px-3 py-3 font-semibold transition-colors hover:bg-green-700">
                    Adicionar
                </button>

            </form>

            <input type="search" placeholder="Pesquisar tarefa..."
                class="w-full min-w-0 border border-indigo-500 rounded-lg px-3 py-3 outline-none focus:ring-2 focus:ring-indigo-500">

            <div class="flex flex-wrap gap-2">

                <button type="button"
                    class="px-4 py-2 rounded-full bg-green-600 text-white text-sm">
                    Todas
                </button>

                <button type="button"
                    class="px-4 py-2 rounded-full bg-slate-200 text-sm">
                    Pendentes
                </button>

                <button type="button"
                    class="px-4 py-2 rounded-full bg-slate-200 text-sm">
                    Concluídas
                </button>

            </div>

        </section>

                            class="w-4 h-4 mt-1 shrink-0 accent-green-600">

                        <span class="min-w-0">
                            <span class="block font-medium text-sm">Trabalho de História</span>

                        </span>

                            Editar

                        <button type="button"
                            class="w-full md:w-auto py-3 px-3 rounded-lg bg-red-100 text-red-700 text-sm hover:bg-red-200">
